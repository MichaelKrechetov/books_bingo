<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивне Бінго</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; padding: 10px; }
        h1 { margin-bottom: 5px; font-size: 1.5rem; text-align: center; }
        .info { margin-bottom: 15px; color: #555; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 600px; aspect-ratio: 1 / 1; }
        .cell { background: #ffffff; border: 2px solid #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 5px; font-size: 0.85rem; font-weight: bold; cursor: pointer; user-select: none; transition: all 0.2s ease; word-break: break-word; }
        .cell:hover { border-color: #888; }
        .cell.selected { background-color: #ff6b6b; color: white; border-color: #e63946; text-decoration: line-through; opacity: 0.8; }
        @media (max-width: 480px) { .cell { font-size: 0.7rem; padding: 2px; } }
    </style>
</head>
<body>

    <h1 id="player-title">Картка Бінго</h1>
    <div class="info">Натискайте на клітинку, щоб закреслити її</div>
    <div class="grid" id="bingo-board"></div>

    <script>
        // 1. Впишіть сюди рівно 25 питань
        const QUESTIONS = [
            "Питання 1", "Питання 2", "Питання 3", "Питання 4", "Питання 5",
            "Питання 6", "Питання 7", "Питання 8", "Питання 9", "Питання 10",
            "Питання 11", "Питання 12", "Питання 13", "Питання 14", "Питання 15",
            "Питання 16", "Питання 17", "Питання 18", "Питання 19", "Питання 20",
            "Питання 21", "Питання 22", "Питання 23", "Питання 24", "Питання 25"
        ];

        // Зчитування ID гравця з URL (наприклад: ?player=1)
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = parseInt(urlParams.get('player')) || 1;
        document.getElementById('player-title').innerText = `Картка Гравця №${playerId}`;

        // Генератор псевдовипадкових чисел на основі ID гравця (Math.sin seed)
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Перемішування масиву за алгоритмом Фішера-Єйтса із зафіксованим seed
        function shuffle(array, seed) {
            let m = array.length, t, i;
            let currentSeed = seed;
            let arr = [...array];
            while (m) {
                i = Math.floor(seededRandom(currentSeed++) * m--);
                t = arr[m];
                arr[m] = arr[i];
                arr[i] = t;
            }
            return arr;
        }

        const shuffledQuestions = shuffle(QUESTIONS, playerId * 999);
        const board = document.getElementById('bingo-board');
        const storageKey = `bingo_player_${playerId}_state`;

        // Зчитування збереженого стану закреслень
        let savedState = JSON.parse(localStorage.getItem(storageKey)) || Array(25).fill(false);

        // Генерація сітки
        shuffledQuestions.forEach((qText, index) => {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.innerText = qText;

            if (savedState[index]) {
                cell.classList.add('selected');
            }

            cell.addEventListener('click', () => {
                cell.classList.toggle('selected');
                savedState[index] = cell.classList.contains('selected');
                localStorage.setItem(storageKey, JSON.stringify(savedState));
            });

            board.appendChild(cell);
        });
    </script>
</body>
</html>
